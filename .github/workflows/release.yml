name: Validate and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: find src services tests -name '*.php' -exec php -l {} \; && php -l script.php
      - run: php tests/policy.php
      - run: php tests/editor-hint.php
      - run: php tests/route-explanation.php
      - run: node --check media/js/editor.js
      - run: php tests/metadata.php
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag and package
        shell: bash
        run: |
          VERSION=$(php -r 'echo simplexml_load_file("canonicalmanager.xml")->version;')
          test "$GITHUB_REF_NAME" = "v$VERSION"
          zip -r "plg_system_canonicalmanager-$VERSION.zip" canonicalmanager.xml script.php services src language media
      - uses: softprops/action-gh-release@v2
        with:
          files: plg_system_canonicalmanager-*.zip
          prerelease: true
