PLG_SYSTEM_CANONICALMANAGER="System – Canonical Manager"
PLG_SYSTEM_CANONICALMANAGER_DESCRIPTION="Canonical URL policy for core articles. Start in audit mode and validate routes before enabling enforcement. Requires PHP 8.3 and Joomla 5 or 6."
PLG_SYSTEM_CANONICALMANAGER_MODE="Operating mode"
PLG_SYSTEM_CANONICALMANAGER_MODE_DESC="Audit logs proposed redirects without changing redirects or canonical tags. Enforcement sends permanent redirects and replaces document API canonical links for supported public article requests."
PLG_SYSTEM_CANONICALMANAGER_AUDIT="Audit only (default)"
PLG_SYSTEM_CANONICALMANAGER_ENFORCE="Enforce canonicals and redirects"
PLG_SYSTEM_CANONICALMANAGER_PANEL="Canonical URL"
PLG_SYSTEM_CANONICALMANAGER_PREVIEW="Preferred article URL"
PLG_SYSTEM_CANONICALMANAGER_SAVE_FIRST="Save this item before its preferred URL can be calculated."
PLG_SYSTEM_CANONICALMANAGER_REASON_ARTICLE="Direct article menu item"
PLG_SYSTEM_CANONICALMANAGER_REASON_CATEGORY="Closest category menu route"
PLG_SYSTEM_CANONICALMANAGER_REASON_FALLBACK="Component route (no suitable public menu item)"
PLG_SYSTEM_CANONICALMANAGER_MULTIPLE="Multiple menu routes exist. Automatic selection uses proximity, language specificity, then the lowest menu item ID."
PLG_SYSTEM_CANONICALMANAGER_ALL_LANGUAGES="This article applies to all languages. The frontend URL depends on the visitor's language; this preview uses the administrator language."
PLG_SYSTEM_CANONICALMANAGER_SAVED_STATE="Preview uses saved values. Save alias, category, language or menu changes and reopen to recalculate."
PLG_SYSTEM_CANONICALMANAGER_ARTICLES="Articles"
PLG_SYSTEM_CANONICALMANAGER_ARTICLE_PARAMETERS="Additional canonical query parameters"
PLG_SYSTEM_CANONICALMANAGER_ARTICLE_PARAMETERS_DESC="By default, extra query parameters are ignored in article canonical tags. Article pagination (start, limitstart, showall) is always included. For project-specific content variants, enter additional exact parameter names, separated by commas, spaces or line breaks (for example: variant, edition). Names are case-sensitive; wildcards are not supported. Redirects still preserve all extra parameters. Required Joomla routing parameters remain managed automatically."
PLG_SYSTEM_CANONICALMANAGER_FRONTPAGE="Frontpage"
PLG_SYSTEM_CANONICALMANAGER_FRONTPAGE_ENABLED="Manage frontpage canonical"
PLG_SYSTEM_CANONICALMANAGER_FRONTPAGE_ENABLED_DESC="When enabled, the default menu item (home page) receives a canonical link to its menu route. Duplicate addresses such as /index.php, ?option=com_content&view=featured or stray query parameters redirect to the canonical home URL in enforce mode and are logged in audit mode."
PLG_SYSTEM_CANONICALMANAGER_FRONTPAGE_PARAMETERS="Additional canonical query parameters"
PLG_SYSTEM_CANONICALMANAGER_FRONTPAGE_PARAMETERS_DESC="Extra query parameters are ignored in the frontpage canonical tag. Pagination (start, limitstart, showall) is always included. Enter additional exact parameter names, separated by commas, spaces or line breaks. Names are case-sensitive; wildcards are not supported."
PLG_SYSTEM_CANONICALMANAGER_FRONTPAGE_REDIRECT_PARAMETERS="Query parameters on redirect"
PLG_SYSTEM_CANONICALMANAGER_FRONTPAGE_REDIRECT_PARAMETERS_DESC="Choose whether redirects to the canonical frontpage drop unknown query parameters or preserve them (for example tracking parameters)."
PLG_SYSTEM_CANONICALMANAGER_FRONTPAGE_REDIRECT_STRIP="Strip unknown parameters (default)"
PLG_SYSTEM_CANONICALMANAGER_FRONTPAGE_REDIRECT_PRESERVE="Preserve all parameters"
PLG_SYSTEM_CANONICALMANAGER_SUMMARY_DETAILS="Based on saved values. The Canonical URL tab explains the URL source and how to change it."
PLG_SYSTEM_CANONICALMANAGER_EXPLAIN_ARTICLE="This URL is supplied by the direct article menu item. With SEF enabled, its menu path (including parent menu aliases) determines the address, rather than the article alias. A home menu item may use the site root. The displayed URL follows the Joomla router configuration."
PLG_SYSTEM_CANONICALMANAGER_EXPLAIN_CATEGORY="This URL uses a menu route for the article category or an ancestor category. With SEF enabled, the menu path supplies the prefix; category segments, the article alias and possibly its ID supply the remaining path. The exact format depends on Joomla router settings."
PLG_SYSTEM_CANONICALMANAGER_EXPLAIN_FALLBACK="No suitable published, publicly accessible article or category menu route was found. Joomla therefore uses a valid component URL, not an error page. For a menu-based URL, an administrator can create a direct article or suitable category menu item, including in a menu not displayed on the site. The article alias is supplied to the Joomla router."
PLG_SYSTEM_CANONICALMANAGER_ARTICLE_ALIAS="Saved article alias"
PLG_SYSTEM_CANONICALMANAGER_MENU_PATH="Saved menu path"
PLG_SYSTEM_CANONICALMANAGER_COPY_URL="Copy URL"
PLG_SYSTEM_CANONICALMANAGER_COPIED="URL copied."
PLG_SYSTEM_CANONICALMANAGER_COPY_FAILED="Copy failed. Select the URL above and copy it manually."
PLG_SYSTEM_CANONICALMANAGER_EDIT_MENU="Edit menu item"
PLG_SYSTEM_CANONICALMANAGER_EDIT_MENU_NOTE="Opens in a new tab. Changes to menu aliases can change public URLs, including child routes. Save your work before making changes."
