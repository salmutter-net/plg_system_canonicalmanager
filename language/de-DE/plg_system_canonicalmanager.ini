PLG_SYSTEM_CANONICALMANAGER="System – Canonical Manager"
PLG_SYSTEM_CANONICALMANAGER_DESCRIPTION="Kanonische URLs für Joomla-Beiträge. Zuerst im Prüfmodus verwenden und Routen vor der Aktivierung testen. Benötigt PHP 8.3 und Joomla 5 oder 6."
PLG_SYSTEM_CANONICALMANAGER_MODE="Betriebsmodus"
PLG_SYSTEM_CANONICALMANAGER_MODE_DESC="Der Prüfmodus protokolliert geplante Weiterleitungen, ohne Weiterleitungen oder Canonical-Tags zu ändern. Der aktive Modus erzwingt permanente Weiterleitungen und ersetzt Canonical-Links der Dokument-API für unterstützte öffentliche Beitragsaufrufe."
PLG_SYSTEM_CANONICALMANAGER_AUDIT="Nur prüfen (Standard)"
PLG_SYSTEM_CANONICALMANAGER_ENFORCE="Canonicals und Weiterleitungen erzwingen"
PLG_SYSTEM_CANONICALMANAGER_PANEL="Kanonische URL"
PLG_SYSTEM_CANONICALMANAGER_PREVIEW="Bevorzugte Beitrags-URL"
PLG_SYSTEM_CANONICALMANAGER_SAVE_FIRST="Speichern Sie den Eintrag zuerst, damit die bevorzugte URL berechnet werden kann."
PLG_SYSTEM_CANONICALMANAGER_REASON_ARTICLE="Direkter Beitrags-Menüeintrag"
PLG_SYSTEM_CANONICALMANAGER_REASON_CATEGORY="Nächstgelegene Kategorie-Menüroute"
PLG_SYSTEM_CANONICALMANAGER_REASON_OVERRIDE="Explizite Beitragszuordnung"
PLG_SYSTEM_CANONICALMANAGER_REASON_FALLBACK="Komponentenroute (kein geeigneter öffentlicher Menüeintrag)"
PLG_SYSTEM_CANONICALMANAGER_MULTIPLE="Mehrere Menürouten vorhanden. Automatische Auswahl nach Nähe, Sprachzuordnung und anschließend niedrigster Menü-ID."
PLG_SYSTEM_CANONICALMANAGER_ALL_LANGUAGES="Dieser Beitrag gilt für alle Sprachen. Die Frontend-URL hängt von der Besuchersprache ab; diese Vorschau verwendet die Administratorsprache."
PLG_SYSTEM_CANONICALMANAGER_SAVED_STATE="Die Vorschau verwendet gespeicherte Werte. Nach Änderungen an Alias, Kategorie, Sprache oder Menü speichern und erneut öffnen."
PLG_SYSTEM_CANONICALMANAGER_OVERRIDE="Bevorzugter Menüeintrag"
PLG_SYSTEM_CANONICALMANAGER_OVERRIDE_DESC="Öffentlichen Menüeintrag dieses Beitrags oder einer übergeordneten Kategorie auswählen. Ungültige Zuordnungen deaktivieren die Durchsetzung für diesen Beitrag und werden protokolliert. Nur Inhaltsadministratoren dürfen diese Einstellung ändern."
PLG_SYSTEM_CANONICALMANAGER_AUTOMATIC="Automatisch"
PLG_SYSTEM_CANONICALMANAGER_ARTICLES="Beiträge"
PLG_SYSTEM_CANONICALMANAGER_ARTICLE_PARAMETERS="Zusätzliche kanonische URL-Parameter"
PLG_SYSTEM_CANONICALMANAGER_ARTICLE_PARAMETERS_DESC="Zusätzliche URL-Parameter werden in kanonischen Beitrags-URLs standardmäßig ignoriert. Die Beitragsseitennavigation (start, limitstart, showall) wird immer berücksichtigt. Für projektspezifische Inhaltsvarianten zusätzliche exakte Parameternamen eingeben, getrennt durch Kommas, Leerzeichen oder Zeilenumbrüche (zum Beispiel: variant, edition). Groß-/Kleinschreibung wird berücksichtigt; Platzhalter werden nicht unterstützt. Weiterleitungen behalten weiterhin alle zusätzlichen Parameter bei. Erforderliche Joomla-Routingparameter werden automatisch verwaltet."
