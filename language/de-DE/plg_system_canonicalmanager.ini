PLG_SYSTEM_CANONICALMANAGER="System – Canonical Manager"
PLG_SYSTEM_CANONICALMANAGER_DESCRIPTION="Kanonische URLs für Joomla-Beiträge. Zuerst im Prüfmodus verwenden und Routen vor der Aktivierung testen. Benötigt PHP 8.3 und Joomla 5 oder 6."
PLG_SYSTEM_CANONICALMANAGER_MODE="Betriebsmodus"
PLG_SYSTEM_CANONICALMANAGER_MODE_DESC="Der Prüfmodus protokolliert geplante Weiterleitungen, ohne Weiterleitungen oder Canonical-Tags zu ändern. Der aktive Modus erzwingt permanente Weiterleitungen und ersetzt Canonical-Links der Dokument-API für unterstützte öffentliche Beitragsaufrufe."
PLG_SYSTEM_CANONICALMANAGER_AUDIT="Nur prüfen (Standard)"
PLG_SYSTEM_CANONICALMANAGER_ENFORCE="Canonicals und Weiterleitungen erzwingen"
PLG_SYSTEM_CANONICALMANAGER_PANEL="Kanonische URL"
PLG_SYSTEM_CANONICALMANAGER_PREVIEW="Bevorzugte Beitrags-URL"
PLG_SYSTEM_CANONICALMANAGER_SAVE_FIRST="Speichern Sie den Eintrag zuerst, damit die bevorzugte URL berechnet werden kann."
PLG_SYSTEM_CANONICALMANAGER_REASON_ARTICLE="Direkter Beitrags-Menüeintrag"
PLG_SYSTEM_CANONICALMANAGER_REASON_CATEGORY="Nächstgelegene Kategorie-Menüroute"
PLG_SYSTEM_CANONICALMANAGER_REASON_FALLBACK="Komponentenroute (kein geeigneter öffentlicher Menüeintrag)"
PLG_SYSTEM_CANONICALMANAGER_MULTIPLE="Mehrere Menürouten vorhanden. Automatische Auswahl nach Nähe, Sprachzuordnung und anschließend niedrigster Menü-ID."
PLG_SYSTEM_CANONICALMANAGER_ALL_LANGUAGES="Dieser Beitrag gilt für alle Sprachen. Die Frontend-URL hängt von der Besuchersprache ab; diese Vorschau verwendet die Administratorsprache."
PLG_SYSTEM_CANONICALMANAGER_SAVED_STATE="Die Vorschau verwendet gespeicherte Werte. Nach Änderungen an Alias, Kategorie, Sprache oder Menü speichern und erneut öffnen."
PLG_SYSTEM_CANONICALMANAGER_ARTICLES="Beiträge"
PLG_SYSTEM_CANONICALMANAGER_ARTICLE_PARAMETERS="Zusätzliche kanonische URL-Parameter"
PLG_SYSTEM_CANONICALMANAGER_ARTICLE_PARAMETERS_DESC="Zusätzliche URL-Parameter werden in kanonischen Beitrags-URLs standardmäßig ignoriert. Die Beitragsseitennavigation (start, limitstart, showall) wird immer berücksichtigt. Für projektspezifische Inhaltsvarianten zusätzliche exakte Parameternamen eingeben, getrennt durch Kommas, Leerzeichen oder Zeilenumbrüche (zum Beispiel: variant, edition). Groß-/Kleinschreibung wird berücksichtigt; Platzhalter werden nicht unterstützt. Weiterleitungen behalten weiterhin alle zusätzlichen Parameter bei. Erforderliche Joomla-Routingparameter werden automatisch verwaltet."
PLG_SYSTEM_CANONICALMANAGER_FRONTPAGE="Startseite"
PLG_SYSTEM_CANONICALMANAGER_FRONTPAGE_ENABLED="Kanonische URL der Startseite verwalten"
PLG_SYSTEM_CANONICALMANAGER_FRONTPAGE_ENABLED_DESC="Wenn aktiviert, erhält der Standard-Menüeintrag (Startseite) einen Canonical-Link auf seine Menüroute. Doppelte Adressen wie /index.php, ?option=com_content&view=featured oder überflüssige URL-Parameter werden im aktiven Modus auf die kanonische Startseiten-URL weitergeleitet und im Prüfmodus protokolliert."
PLG_SYSTEM_CANONICALMANAGER_FRONTPAGE_PARAMETERS="Zusätzliche kanonische URL-Parameter"
PLG_SYSTEM_CANONICALMANAGER_FRONTPAGE_PARAMETERS_DESC="Zusätzliche URL-Parameter werden in kanonischen Startseiten-URLs ignoriert. Die Seitennavigation (start, limitstart, showall) wird immer berücksichtigt. Zusätzliche exakte Parameternamen eingeben, getrennt durch Kommas, Leerzeichen oder Zeilenumbrüche. Groß-/Kleinschreibung wird berücksichtigt; Platzhalter werden nicht unterstützt."
PLG_SYSTEM_CANONICALMANAGER_FRONTPAGE_REDIRECT_PARAMETERS="URL-Parameter bei Weiterleitungen"
PLG_SYSTEM_CANONICALMANAGER_FRONTPAGE_REDIRECT_PARAMETERS_DESC="Legt fest, ob Weiterleitungen auf die kanonische Startseite unbekannte URL-Parameter entfernen oder beibehalten (zum Beispiel Tracking-Parameter)."
PLG_SYSTEM_CANONICALMANAGER_FRONTPAGE_REDIRECT_STRIP="Unbekannte Parameter entfernen (Standard)"
PLG_SYSTEM_CANONICALMANAGER_FRONTPAGE_REDIRECT_PRESERVE="Alle Parameter beibehalten"
PLG_SYSTEM_CANONICALMANAGER_SUMMARY_DETAILS="Basiert auf gespeicherten Werten. Der Tab Kanonische URL erklärt die Herkunft und Änderungsmöglichkeiten der URL."
PLG_SYSTEM_CANONICALMANAGER_EXPLAIN_ARTICLE="Diese URL wird durch den direkten Beitrags-Menüeintrag bestimmt. Bei aktivierten suchmaschinenfreundlichen URLs bestimmt sein Menüpfad (einschließlich übergeordneter Menü-Aliase) die Adresse, nicht der Beitragsalias. Ein Startseiten-Menüeintrag kann das Stammverzeichnis verwenden. Die angezeigte URL folgt den Joomla-Router-Einstellungen."
PLG_SYSTEM_CANONICALMANAGER_EXPLAIN_CATEGORY="Diese URL verwendet eine Menüroute zur Kategorie dieses Beitrags oder einer übergeordneten Kategorie. Bei aktivierten suchmaschinenfreundlichen URLs bestimmt der Menüpfad den vorderen Teil; Kategorieabschnitte, Beitragsalias und gegebenenfalls die Beitrags-ID bilden den weiteren Pfad. Das genaue Format hängt von den Joomla-Router-Einstellungen ab."
PLG_SYSTEM_CANONICALMANAGER_EXPLAIN_FALLBACK="Es wurde keine passende veröffentlichte, öffentlich zugängliche Beitrags- oder Kategorie-Menüroute gefunden. Joomla verwendet deshalb eine gültige Komponenten-URL; dies ist kein Fehler. Für eine menübasierte URL kann ein Administrator einen direkten Beitrags- oder passenden Kategorie-Menüeintrag anlegen, auch in einem nicht angezeigten Menü. Der Beitragsalias wird dem Joomla-Router übergeben."
PLG_SYSTEM_CANONICALMANAGER_ARTICLE_ALIAS="Gespeicherter Beitragsalias"
PLG_SYSTEM_CANONICALMANAGER_MENU_PATH="Gespeicherter Menüpfad"
PLG_SYSTEM_CANONICALMANAGER_COPY_URL="URL kopieren"
PLG_SYSTEM_CANONICALMANAGER_COPIED="URL kopiert."
PLG_SYSTEM_CANONICALMANAGER_COPY_FAILED="Kopieren fehlgeschlagen. Bitte die URL oben markieren und manuell kopieren."
PLG_SYSTEM_CANONICALMANAGER_EDIT_MENU="Menüeintrag bearbeiten"
PLG_SYSTEM_CANONICALMANAGER_EDIT_MENU_NOTE="Öffnet in einem neuen Tab. Änderungen an Menü-Aliasen können öffentliche URLs einschließlich untergeordneter Routen ändern. Speichern Sie Ihre Arbeit vor Änderungen."
